site_name: RISC-V Adventure Documentation

theme:
  name: material
  palette:
    # Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
    # Light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
  features:
    - navigation.tabs         # Enable tabs in header
    - navigation.tabs.sticky  # Keeps navigation tabs visible at the top when scrolling
    - navigation.top          # Adds a "Back to top" button for long pages
    - navigation.instant      # Enables SPA mode for fast page loads without full reloads
    - navigation.tracking     # Dynamically updates the URL anchor in the address bar while scrolling
    - navigation.path         # Shows breadcrumbs above page titles to display current location

    # Search
    - search.suggest          # Enables autocompletion suggestions in the search bar
    - search.highlight        # Highlights search query terms on the destination page

    # Code Blocks
    - content.code.copy        # Adds a "Copy to clipboard" button to all code blocks

repo_url: https://github.com/GGalya1/riscv-architecture-educational-game
repo_name: RISC-V Adventure

nav:
  - Welcome: index.md
  - General:
    - Overview: general/overview.md
    - Credits: general/credits.md
  - About project: about.md
  - Quickstart: quickstart.md
  - Concept: concept.md
  - Technology: tech-stack.md
  - Text animation:
    - Dialogue tags and vertex animation: text_animation/dialogue-text-animation.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

  # Tabbed content
  - pymdownx.tabbed:
      alternate_style: true
      
  # Syntax highlighting for code blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  
  # Task lists with custom checkboxes
  - pymdownx.tasklist:
      custom_checkbox: true
